<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 - Sayfa Bulunamadı | LensEat</title>
<link rel="icon" type="image/webp" href="/assets/icon/icon.webp?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #F0F2F5;
    --surface: #FFFFFF;
    --text: #1F2328;
    --muted: #57606A;
    --blue: #0969DA;
    --mint: #1a7f37;
    --border: rgba(31,35,40,0.12);
  }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    overflow-x: hidden;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ── NAV ── */
  nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    height: 64px;
    background: rgba(255, 255, 255, 0.85);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    border-bottom: 1px solid var(--border);
  }
  .nav-inner {
    max-width: 1200px;
    margin: 0 auto;
    width: 100%;
    height: 100%;
    padding: 0 5%;
    display: flex;
    align-items: center;
  }

  .nav-logo {
    font-size: 18px; font-weight: 700; letter-spacing: -0.5px;
    background: linear-gradient(135deg, var(--blue), #54a3ff);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
    text-decoration: none;
  }

  /* ── 404 HERO ── */
  .error-section {
    flex: 1;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    position: relative;
    padding: 100px 5%;
    text-align: center;
  }

  .bg-orb {
    position: absolute; border-radius: 50%; filter: blur(80px); pointer-events: none;
    z-index: 0;
  }
  .bg-orb.blue {
    width: 500px; height: 500px;
    background: radial-gradient(circle, rgba(9,105,218,0.12) 0%, transparent 70%);
    top: 50%; left: 50%; transform: translate(-50%, -50%);
  }

  .error-content { position: relative; z-index: 1; max-width: 600px; }

  .error-code {
    font-size: clamp(80px, 15vw, 150px);
    font-weight: 900;
    letter-spacing: -5px;
    line-height: 1;
    margin-bottom: 20px;
    background: linear-gradient(135deg, var(--blue), #a5d6ff);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
    text-shadow: 0 10px 30px rgba(9, 105, 218, 0.15);
    animation: float 6s ease-in-out infinite;
  }

  @keyframes float {
    0%, 100% { transform: translateY(0px); }
    50% { transform: translateY(-15px); }
  }

  .error-title {
    font-size: clamp(24px, 4vw, 36px);
    font-weight: 800; letter-spacing: -1px;
    margin-bottom: 16px;
  }

  .error-desc {
    font-size: 17px; color: var(--muted);
    margin-bottom: 40px; line-height: 1.7;
  }

  .btn-primary {
    display: inline-flex; align-items: center; gap: 10px;
    background: var(--blue);
    color: #FFFFFF; border: none;
    border-radius: 14px; padding: 16px 32px;
    font-size: 16px; font-weight: 700;
    cursor: pointer; text-decoration: none;
    transition: all 0.25s;
    box-shadow: 0 4px 20px rgba(9,105,218,0.2), 0 10px 30px rgba(9,105,218,0.1);
  }
  .btn-primary:hover {
    background: #0052a3;
    transform: translateY(-2px);
    box-shadow: 0 6px 24px rgba(9,105,218,0.25), 0 12px 40px rgba(9,105,218,0.15);
  }

  /* ── FOOTER ── */
  footer {
    padding: 32px 5%;
    border-top: 1px solid var(--border);
    text-align: center;
  }
  .footer-copy { color: var(--muted); font-size: 13px; }
</style>
</head>
<body>

<nav>
  <div class="nav-inner">
    <a href="/tr/" class="nav-logo">LensEat</a>
  </div>
</nav>

<section class="error-section">
  <div class="bg-orb blue"></div>
  <div class="error-content">
    <div class="error-code">404</div>
    <h1 class="error-title">Görünüşe göre rotadan çıktınız</h1>
    <p class="error-desc">Aradığınız sayfa bulunamadı veya taşınmış olabilir. Hücresel yaşlanmayı yavaşlatmak ve uzun yaşama dönmek için ana sayfaya dönün.</p>
    <a href="/tr/" class="btn-primary">
      <i class="fa-solid fa-house"></i>
      Ana Sayfaya Dön
    </a>
  </div>
</section>

<footer>
  <div class="footer-copy">© 2026 LensEat. Tüm hakları saklıdır.</div>
</footer>

</body>
</html>
