<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 - Sayfa Bulunamadı | NutriLens</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0D1117;
    --surface: #161B22;
    --text: #E6EDF3;
    --muted: #8B949E;
    --blue: #58A6FF;
    --mint: #7EE787;
    --border: rgba(230,237,243,0.08);
  }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    overflow-x: hidden;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ── NAV ── */
  nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 5%;
    height: 64px;
    background: rgba(13,17,23,0.8);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    border-bottom: 1px solid var(--border);
  }

  .nav-logo {
    font-size: 18px; font-weight: 700; letter-spacing: -0.5px;
    background: linear-gradient(135deg, var(--blue), #a5d6ff);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
    text-decoration: none;
  }

  /* ── 404 HERO ── */
  .error-section {
    flex: 1;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    position: relative;
    padding: 100px 5%;
    text-align: center;
  }

  .bg-orb {
    position: absolute; border-radius: 50%; filter: blur(80px); pointer-events: none;
    z-index: 0;
  }
  .bg-orb.blue {
    width: 500px; height: 500px;
    background: radial-gradient(circle, rgba(88,166,255,0.15) 0%, transparent 70%);
    top: 50%; left: 50%; transform: translate(-50%, -50%);
  }

  .error-content { position: relative; z-index: 1; max-width: 600px; }

  .error-code {
    font-size: clamp(80px, 15vw, 150px);
    font-weight: 900;
    letter-spacing: -5px;
    line-height: 1;
    margin-bottom: 20px;
    background: linear-gradient(135deg, var(--blue), #a5d6ff);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
    text-shadow: 0 20px 40px rgba(0,0,0,0.5);
    animation: float 6s ease-in-out infinite;
  }

  @keyframes float {
    0%, 100% { transform: translateY(0px); }
    50% { transform: translateY(-15px); }
  }

  .error-title {
    font-size: clamp(24px, 4vw, 36px);
    font-weight: 800; letter-spacing: -1px;
    margin-bottom: 16px;
  }

  .error-desc {
    font-size: 17px; color: var(--muted);
    margin-bottom: 40px; line-height: 1.7;
  }

  .btn-primary {
    display: inline-flex; align-items: center; gap: 10px;
    background: var(--blue);
    color: #0D1117; border: none;
    border-radius: 14px; padding: 16px 32px;
    font-size: 16px; font-weight: 700;
    cursor: pointer; text-decoration: none;
    transition: all 0.25s;
    box-shadow: 0 0 40px rgba(88,166,255,0.3), 0 4px 20px rgba(88,166,255,0.2);
  }
  .btn-primary:hover {
    background: #79b8ff;
    transform: translateY(-2px);
    box-shadow: 0 0 60px rgba(88,166,255,0.4), 0 8px 30px rgba(88,166,255,0.3);
  }

  /* ── FOOTER ── */
  footer {
    padding: 32px 5%;
    border-top: 1px solid var(--border);
    text-align: center;
  }
  .footer-copy { color: var(--muted); font-size: 13px; }
</style>
</head>
<body>

<nav>
  <a href="/" class="nav-logo">NutriLens</a>
</nav>

<section class="error-section">
  <div class="bg-orb blue"></div>
  <div class="error-content">
    <div class="error-code">404</div>
    <h1 class="error-title">Görünüşe göre rotadan çıktınız</h1>
    <p class="error-desc">Aradığınız sayfa bulunamadı veya taşınmış olabilir. Hücresel yaşlanmayı yavaşlatmak ve uzun yaşama dönmek için ana sayfaya dönün.</p>
    <a href="/" class="btn-primary">
      <i class="fa-solid fa-house"></i>
      Ana Sayfaya Dön
    </a>
  </div>
</section>

<footer>
  <div class="footer-copy">© 2026 NutriLens. Tüm hakları saklıdır.</div>
</footer>

</body>
</html>
