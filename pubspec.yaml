name: lens_eat
description: "A new Flutter project."
publish_to: 'none'

version: 0.4.32+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter

  package_info_plus: ^8.3.1
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  sqflite: ^2.4.1
  fl_chart: ^0.70.2
  provider: ^6.1.2
  image_picker: ^1.1.2
  shared_preferences: ^2.3.5
  mobile_scanner: ^7.2.0
  flutter_local_notifications: ^17.2.4
  timezone: ^0.9.4
  health: ^13.3.1
  connectivity_plus: ^6.1.5
  camera: ^0.10.6
  permission_handler: ^11.3.1
  firebase_core: ^4.7.0
  firebase_auth: ^6.1.4
  firebase_remote_config: ^6.4.0
  firebase_app_check: ^0.4.3
  cloud_firestore: ^6.3.0
  google_sign_in: ^6.2.2
  intl: ^0.19.0
  photo_manager: ^3.3.0
  image: ^4.3.0
  path_provider: ^2.1.5
  path: ^1.9.1
  flutter_slidable: ^4.0.3
  device_info_plus: ^12.1.0
  firebase_analytics: ^12.3.0
  firebase_storage: ^13.3.0
  intl_utils: ^2.8.14
  url_launcher: ^6.3.2
  cached_network_image: ^3.4.1
  sign_in_with_apple: ^8.1.0
  flutter_markdown: ^0.7.7+1
  firebase_crashlytics: ^5.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.webp"
  min_sdk_android: 21
  adaptive_icon_background: "#1A2E1A"
  adaptive_icon_foreground: "assets/icon/icon.webp"

flutter:
  uses-material-design: true

  assets:
    - assets/icon/
    - assets/ibs/
    - assets/onboarding/
    - assets/profilepic/
    - assets/legal/
